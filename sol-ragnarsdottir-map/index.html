<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sól Ragnarsdóttir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Quiet Pixel foundation.
   Heading font hook: to use Alpha Lyrae, add an @font-face pointing at your local files
   and set --head: 'Alpha Lyrae', var(--mono); */
:root{
  --ground:#0d0f10;
  --panel:rgba(13,15,16,.88);
  --ink:#d9dcd6;
  --dim:#7b817d;
  --rule:#232829;
  --accent:#f2a65a;   /* low winter sun over Faxaflói */
  --mono:'Space Mono', ui-monospace, Menlo, monospace;
  --head:var(--mono);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground);color:var(--ink)}
body{font:14px/1.6 var(--mono);-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor}
a:focus-visible,button:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}

.sheet{display:grid;grid-template-columns:1fr minmax(320px,380px);height:100vh;height:100svh}
.stage{display:grid;grid-template:1fr/1fr;min-height:0;min-width:0}
.map{grid-area:1/1;position:relative;overflow:hidden}
.map canvas{position:absolute;inset:0;width:100%;height:100%}

.title{grid-area:1/1;z-index:3;align-self:start;justify-self:start;margin:24px;
  width:min(440px,calc(100% - 48px));padding:20px 22px;background:var(--panel);border:1px solid var(--rule)}
.title h1{font:700 13px/1.2 var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.title p{margin-top:14px;font:400 clamp(18px,2.1vw,24px)/1.35 var(--head);color:var(--ink)}

.pin{position:absolute;z-index:2;transform:translate(-50%,-50%);
  font-size:11px;line-height:1;padding:6px 7px;background:var(--ground);
  border:1px solid var(--dim);color:var(--ink);transition:background .2s,color .2s,border-color .2s}
.pin.on{background:var(--accent);border-color:var(--accent);color:var(--ground)}

aside{display:flex;flex-direction:column;gap:28px;padding:28px 26px;border-left:1px solid var(--rule);
  overflow-y:auto;min-height:0}
.legend{list-style:none;display:flex;flex-direction:column}
.entry{display:grid;grid-template-columns:3ch 1fr;gap:0 10px;width:100%;padding:12px 0;
  border-bottom:1px solid var(--rule)}
.entry .n{color:var(--dim);font-size:12px;padding-top:2px}
.entry .t{font-weight:700}
.entry .d{grid-column:2;color:var(--dim);font-size:12.5px;line-height:1.5;margin-top:2px}
.entry.on .n,.entry.on .t{color:var(--accent)}
.about{color:var(--ink);font-size:13px}
.contact{font-size:13px}
.colophon{margin-top:auto;font-size:11px;color:var(--dim);letter-spacing:.04em}

@media (max-width:760px){
  .sheet{grid-template-columns:1fr;height:auto}
  .stage{display:contents}
  .title{grid-area:auto;margin:0;max-width:none;border:0;background:none;padding:28px 16px 20px}
  .map{grid-area:auto;position:sticky;top:0;z-index:2;height:46svh;
    background:var(--ground);border-block:1px solid var(--rule)}
  .pin{padding:9px 10px}
  aside{border-left:0;overflow:visible;padding:8px 16px 32px}
}
@media (prefers-reduced-motion:reduce){.pin{transition:none}}
</style>
</head>
<body>
<main class="sheet">
  <div class="stage">
    <header class="title">
      <h1 id="name"></h1>
      <p id="statement"></p>
    </header>
    <div class="map" id="map"><canvas aria-hidden="true"></canvas></div>
  </div>
  <aside>
    <ol class="legend" id="legend"></ol>
    <p class="about" id="about"></p>
    <p class="contact" id="contact"></p>
    <p class="colophon" id="colophon"></p>
  </aside>
</main>

<script>
/* ===== Template inputs: edit these four, then the filler ===== */
const P = {
  name: "Sól Ragnarsdóttir",
  craft: "cartographer",
  city: "Reykjavík", lat: 64.1466, lon: -21.9426,
  technique: "ASCII texture",
  statement: "Maps of Iceland drawn slowly enough to read for pleasure, and accurately enough to walk by.",
  about: "Sól draws maps by hand and finishes them digitally from a small studio near the old harbour. The work sits between survey data and illustration. She takes commissions for atlases, trail systems and the occasional wall map.",
  email: "sol@example.com",
  contactTail: " for commissions.",
  projects: [
    { name: "Hraun Sheets",      desc: "Shaded relief of the Reykjanes lava fields, drawn over six winters.", x:.58, y:.22 },
    { name: "Tide Atlas",        desc: "A pocket atlas of Faxaflói tides for small-boat sailors.",            x:.84, y:.40 },
    { name: "The Long Way North",desc: "A coastal hiking map printed on waterproof stock.",                     x:.44, y:.60 },
    { name: "Retreat Lines",     desc: "A century of glacier margins overlaid on one sheet.",                  x:.72, y:.78 },
    { name: "Unofficial Names",  desc: "The city's street nicknames, collected on foot and mapped.",           x:.22, y:.86 }
  ]
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.title = P.name;
$('name').textContent = P.name;
$('statement').textContent = P.statement;
$('about').textContent = P.about;
$('contact').innerHTML = '';
const mail = Object.assign(document.createElement('a'), { href: 'mailto:' + P.email, textContent: P.email });
$('contact').append(mail, P.contactTail);
const fmt = (v, pos, neg) => Math.abs(v).toFixed(2) + '°' + (v >= 0 ? pos : neg);
const coords = fmt(P.lat, 'N', 'S') + ' ' + fmt(P.lon, 'E', 'W');
$('colophon').textContent = P.city + ' · ' + coords;

/* Build pins + legend from the same data */
const map = $('map'), legend = $('legend');
let hoverIdx = null, pinIdx = null;
const active = () => hoverIdx ?? pinIdx;
const pins = [], entries = [];
P.projects.forEach((p, i) => {
  const num = String(i + 1).padStart(2, '0');
  const pin = document.createElement('button');
  pin.className = 'pin'; pin.textContent = num; pin.setAttribute('aria-label', p.name);
  pin.style.left = p.x * 100 + '%'; pin.style.top = p.y * 100 + '%';
  map.append(pin); pins.push(pin);

  const li = document.createElement('li');
  const b = document.createElement('button');
  b.className = 'entry';
  b.innerHTML = '<span class="n"></span><span class="t"></span><span class="d"></span>';
  b.children[0].textContent = num; b.children[1].textContent = p.name; b.children[2].textContent = p.desc;
  li.append(b); legend.append(li); entries.push(b);

  for (const el of [pin, b]) {
    el.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') setHover(i); });
    el.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') setHover(null); });
    el.addEventListener('focus', () => setHover(i));
    el.addEventListener('blur', () => setHover(null));
    el.addEventListener('click', () => { pinIdx = pinIdx === i ? null : i; sync(); });
  }
});
function setHover(i){ hoverIdx = i; sync(); }
function sync(){
  const a = active();
  pins.forEach((el, i) => el.classList.toggle('on', i === a));
  entries.forEach((el, i) => el.classList.toggle('on', i === a));
  wake();
}

/* ===== Signature: live ASCII contour field =====
   Terrain is fractal noise rendered as contour glyphs. The cursor is a survey lens
   that brings the map into focus; each project raises its own peak of rings. */
const cv = map.querySelector('canvas'), ctx = cv.getContext('2d');
const BANDS = 16, S = 1 / 210;
let W = 0, H = 0, cw = 8, ch = 16, cols = 0, rows = 0, field, peak, R = 150;
let ox = 0, oy = 0, vx = 0.6, vy = -0.25;           // default drift if weather is unavailable
let px = -1e4, py = -1e4, lens = 0, lensT = 0;
const amp = P.projects.map(() => 0);
let dirty = true, running = false, last = 0;
const ink = getComputedStyle(document.documentElement);
const COL = [ink.getPropertyValue('--ink').trim(), ink.getPropertyValue('--accent').trim()];

function hash(x, y){
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, y){
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y){
  return (vnoise(x, y) + .5 * vnoise(x * 2.03, y * 2.03) + .22 * vnoise(x * 4.1, y * 4.1)) / 1.72;
}

function resize(){
  const r = map.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const fs = W < 520 ? 11 : 13;
  ctx.font = fs + 'px "Space Mono", ui-monospace, monospace';
  ctx.textBaseline = 'top';
  cw = ctx.measureText('M').width || fs * .6; ch = Math.round(fs * 1.3);
  cols = Math.ceil(W / cw) + 1; rows = Math.ceil(H / ch) + 1;
  field = new Float32Array(cols * rows); peak = new Float32Array(cols * rows);
  R = W < 520 ? 110 : 150;
  P.projects.forEach(p => { p.px = p.x * W; p.py = p.y * H; });
  dirty = true; wake();
}

const buckets = Array.from({ length: 2 * 21 }, () => []);
function render(){
  const sig2 = 2 * Math.pow(Math.min(W, H) * .12, 2);
  const live = P.projects.map((p, i) => amp[i] > .002 ? [p.px, p.py, amp[i]] : null).filter(Boolean);
  for (let r = 0, i = 0; r < rows; r++){
    const y = r * ch;
    for (let c = 0; c < cols; c++, i++){
      const x = c * cw;
      let h = fbm(x * S + ox, y * S + oy), pk = 0;
      for (const [qx, qy, a] of live){
        const g = a * Math.exp(-((x - qx) ** 2 + (y - qy) ** 2) / sig2);
        h += g * .45; pk = Math.max(pk, g);
      }
      field[i] = h; peak[i] = pk;
    }
  }
  for (const b of buckets) b.length = 0;
  const R2 = R * R;
  for (let r = 1; r < rows - 1; r++){
    const y = r * ch;
    for (let c = 1; c < cols - 1; c++){
      const i = r * cols + c, x = c * cw, h = field[i];
      const band = Math.floor(h * BANDS);
      const edge = band !== Math.floor(field[i + 1] * BANDS) || band !== Math.floor(field[i + cols] * BANDS);
      let L = 0;
      if (lens > .01){
        const d2 = (x - px) ** 2 + (y - py) ** 2;
        if (d2 < R2){ const t = 1 - Math.sqrt(d2) / R; L = lens * t * t * (3 - 2 * t); }
      }
      const pk = peak[i];
      let glyph = null, a = 0;
      if (edge){
        const gx = field[i + 1] - field[i - 1], gy = field[i + cols] - field[i - cols];
        let ang = Math.atan2(gx, -gy) * 57.2958;           // contour runs perpendicular to slope
        ang = ((ang % 180) + 180) % 180;
        glyph = ang < 22.5 || ang >= 157.5 ? '-' : ang < 67.5 ? '\\' : ang < 112.5 ? '|' : '/';
        a = (band % 4 === 0 ? .4 : .17) + L * .6 + pk * .55;
      } else if (L > .06 && ((r + c) & 1) === 0){
        glyph = '.'; a = L * .32;
      } else if (pk > .35 && ((r * 7 + c) % 3) === 0){
        glyph = '.'; a = pk * .25;
      }
      if (!glyph) continue;
      const col = pk > .18 ? 1 : 0;
      const lvl = Math.min(20, Math.round(a * 20));
      if (lvl > 0) buckets[col * 21 + lvl].push(glyph, x, y);
    }
  }
  ctx.clearRect(0, 0, W, H);
  for (let k = 0; k < buckets.length; k++){
    const b = buckets[k]; if (!b.length) continue;
    ctx.fillStyle = COL[k >= 21 ? 1 : 0];
    ctx.globalAlpha = (k % 21) / 20;
    for (let j = 0; j < b.length; j += 3) ctx.fillText(b[j], b[j + 1], b[j + 2]);
  }
  ctx.globalAlpha = 1;
}

function frame(t){
  const dt = Math.min(.1, (t - last) / 1000 || 0);
  if (!reduced && t - last < 32){ requestAnimationFrame(frame); return; } // ~30fps keeps it light
  last = t;
  const k = reduced ? 1 : 1 - Math.exp(-dt * 7);
  let moving = !reduced;
  lens += (lensT - lens) * k; if (Math.abs(lensT - lens) > .002) moving = true;
  const a = active();
  amp.forEach((v, i) => { const tg = i === a ? 1 : 0; amp[i] = v + (tg - v) * k; if (Math.abs(tg - amp[i]) > .002) moving = true; });
  if (!reduced){ ox -= vx * .0022 * dt; oy -= vy * .0022 * dt; }
  if (moving || dirty) render();
  dirty = false;
  if (moving) requestAnimationFrame(frame); else running = false;
}
function wake(){ if (!running){ running = true; requestAnimationFrame(t => { last = t - 40; frame(t); }); } }

map.addEventListener('pointermove', e => {
  const r = map.getBoundingClientRect();
  px = e.clientX - r.left; py = e.clientY - r.top; lensT = 1; dirty = true; wake();
});
map.addEventListener('pointerleave', () => { lensT = 0; wake(); });
map.addEventListener('pointerdown', e => {
  const r = map.getBoundingClientRect();
  px = e.clientX - r.left; py = e.clientY - r.top; lensT = 1; dirty = true; wake();
});
new ResizeObserver(resize).observe(map);
document.fonts && document.fonts.ready.then(resize);

/* ===== Local flavor: live wind steers the drift (Open-Meteo, keyless) ===== */
(async () => {
  try {
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 6000);
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${P.lat}&longitude=${P.lon}` +
      `&current=temperature_2m,wind_speed_10m,wind_direction_10m&wind_speed_unit=ms`;
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) return;
    const cur = (await res.json()).current;
    if (!cur || cur.wind_speed_10m == null) return;
    const spd = cur.wind_speed_10m, from = cur.wind_direction_10m;
    const to = (from + 180) * Math.PI / 180;           // meteorological: direction it blows from
    const s = Math.max(.4, Math.min(spd, 14)) / 3;
    vx = Math.sin(to) * s; vy = -Math.cos(to) * s;
    const dir = ['N','NE','E','SE','S','SW','W','NW'][Math.round(from / 45) % 8];
    $('colophon').textContent = `${P.city} · ${coords} · ${Math.round(cur.temperature_2m)}°C · wind ${Math.round(spd)} m/s ${dir}`;
  } catch (_) { /* offline or blocked: keep default drift and plain colophon */ }
})();
</script>
</body>
</html>
